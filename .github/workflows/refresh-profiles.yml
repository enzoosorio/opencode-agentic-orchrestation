name: refresh-profiles

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      with_providers:
        description: "Also scrape /providers pages on artificialanalysis"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-profiles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTIFY_CHANNEL: ${{ secrets.NOTIFY_CHANNEL || 'telegram' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build profiles
        run: |
          if [ "${{ inputs.with_providers }}" = "true" ]; then
            npm run fetch:profiles -- --providers
          else
            npm run fetch:profiles
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/models/profiles.json docs/scrape_log.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(rag): refresh profiles ($(date -u +%Y-%m-%d))"
          git push
